name: external-link-safety

# Focused frontend verification for the explorer-link safety fix (#496).
# The full frontend suite/typecheck and the Vercel deploy check are separate;
# this job gives every commit on the fix branch a check that exercises the
# changed proof, receipt and transaction links and typechecks the shared
# component together with its call sites.
permissions:
  contents: read

on:
  push:
    branches: [fix/issue-496-external-link-safety]
  pull_request:
    branches: [master, main, v2-rebuild]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-links:
    name: Frontend link tests + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Render proof, receipt and transaction links
        run: pnpm --filter @oversync/frontend test:external-links

      - name: Typecheck shared link component and proof call sites
        run: pnpm --filter @oversync/frontend typecheck:external-links
